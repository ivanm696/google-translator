<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Переводчик</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 900px;
            padding: 30px;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        
        .translator-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .language-select {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        
        select, textarea, button {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        
        textarea {
            min-height: 300px;
            resize: vertical;
            font-family: Arial, sans-serif;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
            grid-column: 1 / -1;
            padding: 15px;
            font-size: 16px;
        }
        
        button:hover {
            background: #764ba2;
        }
        
        button:active {
            transform: scale(0.98);
        }
        
        @media (max-width: 768px) {
            .translator-box {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌐 Google Переводчик</h1>
        
        <div class="translator-box">
            <div>
                <div class="language-select">
                    <label for="sourceLang">Исходный язык:</label>
                    <select id="sourceLang">
                        <option value="auto">Определить язык</option>
                        <option value="ru">Русский</option>
                        <option value="en">English</option>
                        <option value="es">Español</option>
                        <option value="fr">Français</option>
                        <option value="de">Deutsch</option>
                        <option value="it">Italiano</option>
                        <option value="pt">Português</option>
                        <option value="ro">Română</option>
                        <option value="mol">Moldovenesc</option>
                        <option value="uk">Українська</option>
                        <option value="bg">Български</option>
                        <option value="pl">Polski</option>
                        <option value="tr">Türkçe</option>
                        <option value="ja">日本語</option>
                        <option value="zh">中文</option>
                        <option value="ar">العربية</option>
                        <option value="hi">हिन्दी</option>
                    </select>
                </div>
                <label for="sourceText">Введите текст:</label>
                <textarea id="sourceText" placeholder="Введите текст для перевода..."></textarea>
            </div>
            
            <div>
                <div class="language-select">
                    <label for="targetLang">Язык перевода:</label>
                    <select id="targetLang">
                        <option value="ru">Русский</option>
                        <option value="en">English</option>
                        <option value="es">Español</option>
                        <option value="fr">Français</option>
                        <option value="de">Deutsch</option>
                        <option value="it">Italiano</option>
                        <option value="pt">Português</option>
                        <option value="ro">Română</option>
                        <option value="mol">Moldovenesc</option>
                        <option value="uk">Українська</option>
                        <option value="bg">Български</option>
                        <option value="pl">Polski</option>
                        <option value="tr">Türkçe</option>
                        <option value="ja">日本語</option>
                        <option value="zh">中文</option>
                        <option value="ar">العربية</option>
                        <option value="hi">हिन्दी</option>
                    </select>
                </div>
                <label for="translatedText">Переведённый текст:</label>
                <textarea id="translatedText" placeholder="Здесь появится перевод..." readonly></textarea>
            </div>
        </div>
        
        <button onclick="translate()">📤 Перевести</button>
    </div>

    <script>
        // Преобразование ISO 639-3 кодов в ISO 639-1 для API
        const iso3to1 = {
            'mol': 'ro',  // Молдавский (ISO 639-3) → Румынский (ISO 639-1)
            'auto': 'auto'
        };
        
        async function translate() {
            const sourceText = document.getElementById('sourceText').value.trim();
            let sourceLang = document.getElementById('sourceLang').value;
            let targetLang = document.getElementById('targetLang').value;
            const translatedArea = document.getElementById('translatedText');
            
            if (!sourceText) {
                alert('Пожалуйста, введите текст для перевода!');
                return;
            }
            
            // Преобразуем коды языков для API
            const apiSourceLang = iso3to1[sourceLang] || sourceLang;
            const apiTargetLang = iso3to1[targetLang] || targetLang;
            
            translatedArea.value = 'Переводим...';
            
            try {
                // Используем API mymemory.translated.net (бесплатный API)
                const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(sourceText)}&langpair=${apiSourceLang}|${apiTargetLang}`;
                
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.responseStatus === 200) {
                    translatedArea.value = data.responseData.translatedText;
                } else {
                    translatedArea.value = 'Ошибка при переводе. Попробуйте позже.';
                }
            } catch (error) {
                translatedArea.value = 'Ошибка: ' + error.message;
                console.error('Ошибка перевода:', error);
            }
        }
        
        // Позволяет переводить по Ctrl+Enter
        document.getElementById('sourceText').addEventListener('keypress', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                translate();
            }
        });
    </script>
</body>
</html>
