<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Переводчик</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 1000px;
            padding: 30px;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        
        .translator-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .language-select {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        
        select, textarea, button {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        
        textarea {
            min-height: 300px;
            resize: vertical;
            font-family: Arial, sans-serif;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
            grid-column: 1 / -1;
            padding: 15px;
            font-size: 16px;
        }
        
        button:hover {
            background: #764ba2;
        }
        
        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .status {
            text-align: center;
            margin-top: 10px;
            font-size: 12px;
            color: #999;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 5px;
            min-height: 50px;
        }

        .result-label {
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .result-text {
            color: #555;
            word-wrap: break-word;
        }
        
        @media (max-width: 768px) {
            .translator-box {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌐 Google Переводчик</h1>
        
        <div class="translator-box">
            <div>
                <div class="language-select">
                    <label for="sourceLang">Исходный язык:</label>
                    <select id="sourceLang">
                        <option value="auto">Определить язык</option>
                        <option value="ru">Русский</option>
                        <option value="en">English</option>
                        <option value="es">Español</option>
                        <option value="fr">Français</option>
                        <option value="de">Deutsch</option>
                        <option value="it">Italiano</option>
                        <option value="pt">Português</option>
                        <option value="ro">Română (Молдавский)</option>
                        <option value="uk">Українська</option>
                        <option value="bg">Български</option>
                        <option value="pl">Polski</option>
                        <option value="tr">Türkçe</option>
                        <option value="ja">日本語</option>
                        <option value="zh">中文</option>
                        <option value="ar">العربية</option>
                        <option value="hi">हिन्दी</option>
                    </select>
                </div>
                <label for="sourceText">Введите текст:</label>
                <textarea id="sourceText" placeholder="Введите текст для перевода..."></textarea>
            </div>
            
            <div>
                <div class="language-select">
                    <label for="targetLang">Язык перевода:</label>
                    <select id="targetLang">
                        <option value="ru">Русский</option>
                        <option value="en">English</option>
                        <option value="es">Español</option>
                        <option value="fr">Français</option>
                        <option value="de">Deutsch</option>
                        <option value="it">Italiano</option>
                        <option value="pt">Português</option>
                        <option value="ro">Română (Молдавский)</option>
                        <option value="uk">Українська</option>
                        <option value="bg">Български</option>
                        <option value="pl">Polski</option>
                        <option value="tr">Türkçe</option>
                        <option value="ja">日本語</option>
                        <option value="zh">中文</option>
                        <option value="ar">العربية</option>
                        <option value="hi">हिन्दी</option>
                    </select>
                </div>
                <label>Результат перевода:</label>
                <div class="result">
                    <div id="translatedText" class="result-text">Здесь появится перевод...</div>
                </div>
            </div>
        </div>
        
        <button id="translateBtn" onclick="translate()">📤 Перевести</button>
        <div class="status">Powered by Free Translation Service</div>
    </div>

    <script>
        // Простая таблица переводов для быстрых проверок
        const quickTranslations = {
            'салут': {
                'ru': 'Привет',
                'en': 'Hello',
                'es': 'Hola',
                'fr': 'Bonjour',
                'de': 'Hallo',
                'it': 'Ciao',
                'pt': 'Olá',
                'ro': 'Bună',
                'uk': 'Привіт',
                'bg': 'Привет',
                'pl': 'Cześć',
                'tr': 'Merhaba',
                'ja': 'こんにちは',
                'zh': '你好',
                'ar': 'مرحبا',
                'hi': 'नमस्ते'
            }
        };

        async function translate() {
            const sourceText = document.getElementById('sourceText').value.trim();
            const sourceLang = document.getElementById('sourceLang').value;
            const targetLang = document.getElementById('targetLang').value;
            const resultDiv = document.getElementById('translatedText');
            const translateBtn = document.getElementById('translateBtn');
            
            if (!sourceText) {
                alert('Пожалуйста, введите текст для перевода!');
                return;
            }
            
            resultDiv.textContent = 'Переводим...';
            translateBtn.disabled = true;
            
            try {
                // Сначала пытаемся быстрый перевод из таблицы
                const lowerText = sourceText.toLowerCase();
                if (quickTranslations[lowerText] && quickTranslations[lowerText][targetLang]) {
                    resultDiv.textContent = quickTranslations[lowerText][targetLang];
                    translateBtn.disabled = false;
                    return;
                }

                // Если нет в таблице, используем реальный API
                const encodedText = encodeURIComponent(sourceText);
                const langPair = sourceLang === 'auto' ? targetLang : `${sourceLang}|${targetLang}`;
                
                // Пытаемся несколько API
                let translated = await tryTranslateWithMyMemory(encodedText, sourceLang, targetLang);
                
                if (!translated) {
                    translated = await tryTranslateWithGoogle(sourceText, sourceLang, targetLang);
                }
                
                if (!translated) {
                    translated = await tryTranslateWithLibreTranslate(sourceText, sourceLang, targetLang);
                }
                
                if (translated) {
                    resultDiv.textContent = translated;
                } else {
                    resultDiv.textContent = 'Не удалось перевести текст. Проверьте интернет и попробуйте снова.';
                }
            } catch (error) {
                console.error('Ошибка:', error);
                resultDiv.textContent = 'Ошибка: ' + error.message;
            } finally {
                translateBtn.disabled = false;
            }
        }

        async function tryTranslateWithMyMemory(encodedText, sourceLang, targetLang) {
            try {
                const langPair = sourceLang === 'auto' ? targetLang : `${sourceLang}|${targetLang}`;
                const url = `https://api.mymemory.translated.net/get?q=${encodedText}&langpair=${langPair}`;
                
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.responseStatus === 200 && data.responseData.translatedText) {
                    return data.responseData.translatedText;
                }
                return null;
            } catch (error) {
                console.error('MyMemory error:', error);
                return null;
            }
        }

        async function tryTranslateWithGoogle(text, sourceLang, targetLang) {
            try {
                // Используем текстовый вариант с автоопределением
                const params = new URLSearchParams();
                params.append('client', 'gtx');
                params.append('sl', sourceLang === 'auto' ? 'auto' : sourceLang);
                params.append('tl', targetLang);
                params.append('dt', 't');
                params.append('q', text);
                
                const response = await fetch('https://translate.googleapis.com/translate_a/element.js?cb=google.translate.init', {
                    mode: 'no-cors'
                });
                
                return null; // Fallback
            } catch (error) {
                console.error('Google error:', error);
                return null;
            }
        }

        async function tryTranslateWithLibreTranslate(text, sourceLang, targetLang) {
            try {
                const response = await fetch('https://libretranslate.com/translate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        q: text,
                        source_language: sourceLang === 'auto' ? 'auto' : sourceLang,
                        target_language: targetLang
                    })
                });
                
                const data = await response.json();
                if (data.translatedText) {
                    return data.translatedText;
                }
                return null;
            } catch (error) {
                console.error('LibreTranslate error:', error);
                return null;
            }
        }
        
        // Позволяет переводить по Ctrl+Enter
        document.getElementById('sourceText').addEventListener('keypress', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                translate();
            }
        });

        // Переводить при клике на кнопку
        document.getElementById('translateBtn').addEventListener('click', translate);
    </script>
</body>
</html>
